[package]
name = "rchat"
version = "0.1.0"
edition = "2021"
description = "P2P pixelated terminal chat over the rnet overlay"
license = "MIT"

[[bin]]
name = "rchat"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["clock"], default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
